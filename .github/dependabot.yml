# .github/dependabot.yml
version: 2
updates:
  # Keep GitHub Actions SHAs up to date automatically
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  # Keep pnpm frontend deps up to date
  - package-ecosystem: "npm"
    directory: "/src/frontend/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Keep NuGet backend deps up to date
  - package-ecosystem: "nuget"
    directory: "/src/backend"
    schedule:
      interval: "weekly"
