name: Security & Vulnerability Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Supply Chain & Dependency Audit
  # ─────────────────────────────────────────────
  dependency-audit:
    name: Dependency Audit (pnpm & NuGet)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # @v4.2.2

      # Frontend Audit
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # @v6.4.0
        with:
          node-version: '20.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # @v4.1.0
        with:
          version: 9
          run_install: false

      - name: Run pnpm audit (Frontend)
        run: |
          cd src/frontend/web
          pnpm audit --audit-level=high

      # Backend Audit
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # @v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: NuGet Vulnerability Scan
        run: |
          dotnet restore src/backend/Api/Api.csproj
          dotnet list src/backend/Api/Api.csproj package --vulnerable --include-transitive

  # ─────────────────────────────────────────────
  # JOB 2: Static Application Security Testing (SAST)
  # ─────────────────────────────────────────────
  sast:
    name: Static Application Security Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # @v4.2.2

      - name: Run custom SAST checks (JWT & API Keys)
        run: |
          echo "Scanning for Client-Side JWT storage violations (localStorage)..."
          if grep -r "localStorage.setItem.*token" src/frontend/web/src/ 2>/dev/null; then
            echo "::warning::Client-side localStorage usage for JWT tokens detected!"
          fi
          
          echo "Scanning for Client-Side Secret Injection in config files..."
          if grep -r "GEMINI_API_KEY" vite.config.ts 2>/dev/null; then
            echo "::warning::API keys exposed in Vite configuration define block!"
          fi

      - name: Run Semgrep OSS Scan
        run: |
          pip install semgrep
          semgrep --config=auto --error

  # ─────────────────────────────────────────────
  # JOB 3: Credentials & Secret Leak Detection
  # ─────────────────────────────────────────────
  secret-scan:
    name: Secret Leak Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # @v4.2.2
        with:
          fetch-depth: 0

      - name: Scan Git History for Secrets
        run: |
          echo "Checking for leaked API keys, tokens or credentials..."
          # Scan for Resend API keys or other keys in commits
          if git log --all -p | grep -E "(RESEND_APITOKEN|GEMINI_API_KEY)\s*=\s*[a-zA-Z0-9_-]{20,}" 2>/dev/null; then
            echo "::error::API key assignments found in Git logs!"
            exit 1
          fi
          echo "✓ No active secrets found in history."
