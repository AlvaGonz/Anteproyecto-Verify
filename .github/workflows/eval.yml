name: Run Skill Evaluations

on:
  pull_request:
    branches: [main]
    paths:
      - 'evals/**'
      - '.agents/skills/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: Readiness Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install waza
        run: |
          curl -fsSL https://raw.githubusercontent.com/microsoft/waza/main/install.ps1 | pwsh
      - name: Check all skills
        run: waza check --strict .agents/skills/

  eval:
    name: Run Evaluations
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install waza
        run: |
          curl -fsSL https://raw.githubusercontent.com/microsoft/waza/main/install.ps1 | pwsh
      - name: Run evaluations
        run: waza run --discover --strict --path .agents/skills/
      - name: Generate coverage report
        run: waza coverage --format markdown --path .agents/skills/ > evals/coverage-report.md
      - name: Comment coverage on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('evals/coverage-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📊 Eval Coverage\n\n${report}`
            });
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: ./evals/coverage-report.md
          retention-days: 30
