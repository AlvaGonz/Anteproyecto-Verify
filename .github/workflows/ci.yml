name: CI

on:
  push:
    branches:
      - main
      - front-dev-ui-fixes
      - feat
  pull_request:
    branches:
      - main
      - develop
      - feat

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Backend — Build + Unit & Integration Tests
  # ─────────────────────────────────────────────
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: |
          dotnet restore src/backend/Api/Api.csproj
          dotnet restore src/backend/Application/Application.csproj
          dotnet restore src/backend/Domain/Domain.csproj
          dotnet restore src/backend/Infrastructure/Infrastructure.csproj
          dotnet restore src/backend/Api.Tests/Api.Tests.csproj
          dotnet restore tests/backend/UnitTests/UnitTests.csproj
          dotnet restore tests/backend/IntegrationTests/IntegrationTests.csproj

      - name: Build — Domain
        run: dotnet build src/backend/Domain/Domain.csproj --no-restore --configuration Release

      - name: Build — Application
        run: dotnet build src/backend/Application/Application.csproj --no-restore --configuration Release

      - name: Build — Infrastructure
        run: dotnet build src/backend/Infrastructure/Infrastructure.csproj --no-restore --configuration Release

      - name: Build — Api
        run: dotnet build src/backend/Api/Api.csproj --no-restore --configuration Release

      - name: Build — Api.Tests
        run: dotnet build src/backend/Api.Tests/Api.Tests.csproj --no-restore --configuration Release

      - name: Build — Unit Tests
        run: dotnet build tests/backend/UnitTests/UnitTests.csproj --no-restore --configuration Release

      - name: Build — Integration Tests
        run: dotnet build tests/backend/IntegrationTests/IntegrationTests.csproj --no-restore --configuration Release

      - name: Run Unit Tests
        run: |
          dotnet test tests/backend/UnitTests/UnitTests.csproj \
            --no-build \
            --configuration Release \
            --logger "console;verbosity=normal" \
            --filter "Category!=Integration"

      - name: Integration Tests (TestContainers)
        run: |
          dotnet test src/backend/Tests/Integration/ \
            --logger "trx;LogFileName=integration-results.trx" \
            --results-directory ./test-results
        env:
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Run Integration Tests
        run: |
          dotnet test tests/backend/IntegrationTests/IntegrationTests.csproj \
            --no-build \
            --configuration Release \
            --logger "console;verbosity=normal" \
            --filter "Category!=Integration"

      - name: Run Api.Tests
        run: |
          dotnet test src/backend/Api.Tests/Api.Tests.csproj \
            --no-build \
            --configuration Release \
            --logger "console;verbosity=normal"

  # ─────────────────────────────────────────────
  # JOB 2: Frontend — Install + Build + Lint
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend (React 19 + Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/frontend/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('src/frontend/web/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: RegisterPage smoke test (TRD registration fields)
        run: pnpm run test --run src/pages/auth/__tests__/RegisterPage.test.tsx

      - name: Run E2E tests (Playwright)
        working-directory: .
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test e2e/projects/project-crud.spec.ts
        env:
          VITE_USE_MOCK: 'true'

      - name: Build
        run: pnpm run build

  # ─────────────────────────────────────────────
  # JOB 3: Security — Secret scanning
  # ─────────────────────────────────────────────
  security:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for leaked secrets
        run: |
          # Solo detecta assignments reales de la variable de entorno, no strings en tests
          if git log --all -p | grep -E "RESEND_APITOKEN\s*=\s*re_[a-zA-Z0-9]{20,}" 2>/dev/null; then
            echo "::error::Resend API key assignment detected in git history!"
            exit 1
          fi
          # Detecta .env files con keys reales (no archivos .env.example)
          if git log --all -p -- '*.env' | grep -v '.env.example' | grep -E "re_[a-zA-Z0-9]{24,}" 2>/dev/null; then
            echo "::error::Potential Resend API key in .env file detected in git history!"
            exit 1
          fi
          echo "✓ No leaked secrets detected"

  # ─────────────────────────────────────────────
  # JOB 4: E2E Tests (Playwright)
  # ─────────────────────────────────────────────
  e2e-tests:
    name: E2E Auth Tests
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v3
      with:
        version: 9
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Install dependencies
      run: |
        pnpm install
        pnpm exec playwright install --with-deps chromium
    - name: Run Playwright tests
      env:
        ASPNETCORE_ENVIRONMENT: Development
      run: pnpm exec playwright test e2e/auth/
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report
        path: playwright-report/

