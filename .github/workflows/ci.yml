name: CI

on:
  push:
    branches:
      - main
      - front-dev-ui-fixes
  pull_request:
    branches:
      - main

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'
  PNPM_VERSION: '9'

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Backend — Build + Unit & Integration Tests
  # ─────────────────────────────────────────────
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore src/backend/

      - name: Build (Release)
        run: dotnet build src/backend/ --no-restore --configuration Release

      - name: Run Unit Tests
        run: |
          dotnet test tests/backend/UnitTests/ \
            --no-build \
            --configuration Release \
            --logger "console;verbosity=normal" \
            --filter "Category!=Integration"

      - name: Run Integration Tests
        run: |
          dotnet test tests/backend/IntegrationTests/ \
            --no-build \
            --configuration Release \
            --logger "console;verbosity=normal" \
            --filter "Category!=Integration"

      - name: Run Api.Tests
        run: |
          dotnet test src/backend/Api.Tests/ \
            --no-build \
            --configuration Release \
            --logger "console;verbosity=normal"

  # ─────────────────────────────────────────────
  # JOB 2: Frontend — Install + Build + Lint
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend (React 19 + Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/frontend/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('src/frontend/web/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test --run
        continue-on-error: true
        # continue-on-error: true temporalmente — solo 2 tests existen ahora
        # Cambiar a false cuando la cobertura sea adecuada (ITEM 8 del audit)

  # ─────────────────────────────────────────────
  # JOB 3: Security — Secret scanning
  # ─────────────────────────────────────────────
  security:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for leaked secrets
        run: |
          # Verify no API keys committed
          if git log --all -p | grep -E "(re_[a-zA-Z0-9]{20,}|RESEND_APITOKEN\s*=\s*re_)" 2>/dev/null; then
            echo "::error::Potential Resend API key detected in git history!"
            exit 1
          fi
          echo "✓ No secrets detected"
