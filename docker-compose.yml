servic/es:
  api:
    build:
      context: .
      dockerfile: docker/api.dev.Dockerfile
    ports:
      - "5000:8080"
    volumes:
      - .:/src
      - /src/src/backend/Domain/bin
      - /src/src/backend/Domain/obj
      - /src/src/backend/Application/bin
      - /src/src/backend/Application/obj
      - /src/src/backend/Infrastructure/bin
      - /src/src/backend/Infrastructure/obj
      - /src/src/backend/Api/bin
      - /src/src/backend/Api/obj
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UseMockData=false
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Initial Catalog=verifinca-spm-uce-2026;User ID=sa;Password=Your_password123;TrustServerCertificate=True;
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M

  web:
    build:
      context: .
      dockerfile: docker/web.dev.Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./src/frontend/web:/app/src/frontend/web
      - /app/src/frontend/web/node_modules
      - /app/node_modules
    environment:
      - VITE_WATCH_POLLING=true
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M

  sqlserver:
    build:
      context: .
      dockerfile: docker/SQL_Server/Dockerfile
    user: "0:0"
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_password123
    volumes:
      - mssql-data:/var/opt/mssql/data
      - ./Build-Database-Sql.sql:/usr/config/Build-Database-Sql.sql:ro
      - ./src/backend/Tools/DbSeeder/Scripts:/usr/config/seeds:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "test -f /tmp/db_ready && /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_password123' -Q 'SELECT 1' -C" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "1.5"
        reservations:
          memory: 2G

  azurite:
    build:
      context: .
      dockerfile: docker/azurite.Dockerfile
    ports:
      - "10000:10000"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M

  python_env:
    image: python:3.12-slim
    volumes:
      - .:/src
    working_dir: /src
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Initial Catalog=verifinca-spm-uce-2026;User ID=sa;Password=Your_password123;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy
    command: sh -c "pip install pymssql && python -u Bots/DGII/code/up_DGII.py && python -u generador_entidades_gubernamentales.py"

volumes:
  mssql-data:
