version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/api.dev.Dockerfile
    ports:
      - "5000:8080"
    volumes:
      - .:/src
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UseMockData=false
    env_file:
      - .env
    depends_on:
      - sqlserver
      - azurite

  web:
    build:
      context: .
      dockerfile: docker/web.dev.Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Bind-mount source code for HMR / hot-reload
      - ./src/frontend/web:/app/src/frontend/web
      # Named volumes keep Linux-native node_modules INSIDE the container
      # and prevent the Windows host from overwriting them with broken symlinks
      - web_root_node_modules:/app/node_modules
      - web_frontend_node_modules:/app/src/frontend/web/node_modules
    environment:
      - VITE_WATCH_POLLING=true
    env_file:
      - .env

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_password123

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10000:10000"

volumes:
  web_root_node_modules:
  web_frontend_node_modules:

