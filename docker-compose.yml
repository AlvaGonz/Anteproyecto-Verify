services:
  api:
    build:
      context: .
      dockerfile: docker/api.dev.Dockerfile
    ports:
      - "5000:8080"
    volumes:
      - .:/src
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UseMockData=false
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M

  web:
    build:
      context: .
      dockerfile: docker/web.dev.Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./src/frontend/web:/app/src/frontend/web
      - /app/src/frontend/web/node_modules
      - /app/node_modules
    environment:
      - VITE_WATCH_POLLING=true
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M

  sqlserver:
    build:
      context: .
      dockerfile: docker/SQL_Server/Dockerfile
    user: "0:0"
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_password123
    volumes:
      - mssql-data:/var/opt/mssql/data
      - ./Build-Database-Sql.sql:/usr/config/Build-Database-Sql.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "Your_password123", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 512M

  azurite:
    build:
      context: .
      dockerfile: docker/azurite.Dockerfile
    ports:
      - "10000:10000"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M

volumes:
  mssql-data: