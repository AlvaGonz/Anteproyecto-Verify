services:
  api:
    build:
      context: .
      dockerfile: docker/api.dev.Dockerfile
    ports:
      - "5000:8080"
    volumes:
      - .:/src
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UseMockData=false
    env_file:
      - .env
    depends_on:
      - sqlserver
      - azurite

  web:
    build:
      context: .
      dockerfile: docker/web.dev.Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./src/frontend/web:/app/src/frontend/web
      - /app/src/frontend/web/node_modules
      - /app/node_modules
    environment:
      - VITE_WATCH_POLLING=true
    env_file:
      - .env

  sqlserver:
    build:
      context: .
      dockerfile: docker/SQL_Server/Dockerfile
    user: "0:0"
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_password123
    volumes:
      - mssql-data:/var/opt/mssql/data
      - ./Build-Database-Sql.sql:/usr/config/Build-Database-Sql.sql:ro

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10000:10000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  mssql-data:

