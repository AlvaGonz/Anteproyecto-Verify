services:
  api:
    build:
      context: .
      dockerfile: docker/api.dev.Dockerfile
    ports:
      - "5000:8080"
    volumes:
      - .:/src
      - /src/src/backend/Domain/bin
      - /src/src/backend/Domain/obj
      - /src/src/backend/Application/bin
      - /src/src/backend/Application/obj
      - /src/src/backend/Infrastructure/bin
      - /src/src/backend/Infrastructure/obj
      - /src/src/backend/Api/bin
      - /src/src/backend/Api/obj
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UseMockData=false
    env_file:
      - .env
    depends_on:
      - sqlserver
      - azurite
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M

  web:
    build:
      context: .
      dockerfile: docker/web.dev.Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./src/frontend/web:/app/src/frontend/web
      - /app/src/frontend/web/node_modules
      - /app/node_modules
    environment:
      - VITE_WATCH_POLLING=true
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M

  sqlserver:
    build:
      context: .
      dockerfile: docker/SQL_Server/Dockerfile
    user: "0:0"
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_password123
    volumes:
      - mssql-data:/var/opt/mssql/data
      - ./Build-Database-Sql.sql:/usr/config/Build-Database-Sql.sql:ro
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "1.5"
        reservations:
          memory: 2G

  azurite:
    build:
      context: .
      dockerfile: docker/azurite.Dockerfile
    ports:
      - "10000:10000"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M

volumes:
  mssql-data:
