version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    env_file:
      - .env
    depends_on:
      - sqlserver
      - azurite

  web:
    build:
      context: ./src/frontend/web
      dockerfile: ../../../docker/web.dev.Dockerfile
    ports:
      - "3000:3000"
    # volumes:
    #   - type: bind
    #     source: ./src/frontend/web
    #     target: /app
    #   - /app/node_modules
    environment:
      - VITE_WATCH_POLLING=true
    env_file:
      - .env

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_password123

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10000:10000"
