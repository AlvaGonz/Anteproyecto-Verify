services:
  api:
    build:
      context: ./src/backend
      dockerfile: ../../docker/api.dev.Dockerfile
    ports:
      - "5000:8080"
    volumes:
      - .:/src
      - api_uploads:/app/wwwroot/uploads
      - /src/src/backend/Domain/bin
      - /src/src/backend/Domain/obj
      - /src/src/backend/Application/bin
      - /src/src/backend/Application/obj
      - /src/src/backend/Infrastructure/bin
      - /src/src/backend/Infrastructure/obj
      - /src/src/backend/Api/bin
      - /src/src/backend/Api/obj
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UseMockData=false
      - ConnectionStrings__DefaultConnection=$ConnectionStrings__DockerConnection
    env_file:
      - .env
    entrypoint: ["dotnet", "Api.dll", "--urls", "http://0.0.0.0:8080"]
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M

  web:
    build:
      context: .
      dockerfile: docker/web.dev.Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./src/frontend/web:/app/src/frontend/web
    environment:
      - VITE_WATCH_POLLING=true
    env_file:
      - .env
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 512M

  sqlserver:
    build:
      context: .
      dockerfile: docker/SQL_Server/Dockerfile
    user: "0:0"
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=$DB_PASSWORD
    volumes:
      - mssql-data:/var/opt/mssql/data
      - ./Build-Database-Sql.sql:/usr/config/Build-Database-Sql.sql:ro
      - ./src/backend/Tools/DbSeeder/Scripts:/usr/config/seeds:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "test -f /tmp/db_ready && /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '$DB_PASSWORD' -Q 'SELECT 1' -C" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "1.5"
        reservations:
          memory: 2G

  azurite:
    build:
      context: .
      dockerfile: docker/azurite.Dockerfile
    ports:
      - "10000:10000"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M

  python_env:
    image: python:3.12-slim
    volumes:
      - .:/src
    working_dir: /src
    env_file:
      - .env
    environment:
      - ConnectionStrings__DefaultConnection=$ConnectionStrings__DockerConnection
    depends_on:
      sqlserver:
        condition: service_healthy
    command: sh -c "pip install pymssql && python -u Bots/DGII/code/up_DGII.py && python -u generador_entidades_gubernamentales.py"

volumes:
  mssql-data:
  api_uploads:
